<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresko - Inventory</title>
    <meta name="description"
        content="Manage your household grocery inventory, track expiration dates, and reduce food waste with Fresko.">
    <meta name="author" content="José Roberto Hernández Peña">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="Fresko - Your Smart Pantry">
    <meta property="og:description" content="Track your groceries and fight food waste with style.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://jsr7k-dotcom.github.io/wdd231/final-project/images/og-image.png">
    <meta property="og:url" content="https://jsr7k-dotcom.github.io/wdd231/final-project/index.html">

    <!-- Fonts: Archivo Black & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/add-item.css">
    <!-- JS -->
    <script type="module" src="scripts/app.js"></script>
    <!-- Favicon -->
    <link rel="icon" href="images/favicon-fresko.png">
</head>

<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <img src="images/logo-fresko.png" alt="Fresko Logo" class="logo-img">
            </div>
            <nav class="header-nav">
                <a href="index.html">Home</a>
                <a href="add-item.html" class="active">Add Item</a>
                <a href="recipes.html">Recipes</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Add New Item</h1>

        <div class="search-area">
            <div class="search-input-group">
                <input type="text" id="search-input" placeholder="e.g. Milk, Avocados...">
                <button class="btn-primary" id="search-btn">Search</button>
            </div>
            <div id="results-dropdown" class="results-dropdown">
                <!-- Dropdown populated by JS -->
            </div>
        </div>

        <div id="add-form" class="form-container">
            <h2>Item Details</h2>
            <form id="item-form">
                <input type="hidden" id="item-image-url">

                <div class="form-group">
                    <label for="item-name">Product Name</label>
                    <input type="text" id="item-name" required>
                </div>

                <div class="form-group">
                    <label for="item-category">Category</label>
                    <select id="item-category">
                        <option value="Pantry">Pantry</option>
                        <option value="Dairy">Dairy</option>
                        <option value="Produce">Produce</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Meat">Meat</option>
                        <option value="Frozen">Frozen</option>
                        <option value="Beverages">Beverages</option>
                        <option value="Snacks">Snacks</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item-quantity">Quantity</label>
                    <input type="number" id="item-quantity" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="item-expiry">Expiration Date</label>
                    <input type="date" id="item-expiry" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary btn-flex">Add to Pantry</button>
                    <button type="button" id="cancel-btn" class="btn-secondary btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>José Roberto Hernández Peña | 2026 &copy; Fresko</p>
        <a href="https://youtu.be/n72Fk1OflOE" target="_blank">Watch Demo Video (YouTube)</a>
    </footer>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="location.href='index.html'">
            <span class="material-symbols-outlined nav-icon">home</span>
            Home
        </button>
        <div class="add-btn-wrapper">
            <button class="add-btn mobile-add-btn" onclick="location.href='add-item.html'">
                <span class="material-symbols-outlined">add</span>
            </button>
        </div>
        <button class="nav-item" onclick="location.href='recipes.html'">
            <span class="material-symbols-outlined nav-icon">restaurant_menu</span>
            Recipes
        </button>
    </nav>

</body>

</html>
