<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresko - Recipes</title>
    <meta name="description"
        content="Find recipes based on your household grocery inventory. Use up expiring items and save money.">
    <meta name="author" content="José Roberto Hernández Peña">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="Fresko - Recipes">
    <meta property="og:description" content="Find recipes based on your household grocery inventory. Use up expiring items and save money.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://jsr7k-dotcom.github.io/wdd231/final-project/images/og-image.png">
    <meta property="og:url" content="https://jsr7k-dotcom.github.io/wdd231/final-project/index.html">

    <!-- Fonts: Archivo Black & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/recipes.css">
    <!-- JS -->
    <script type="module" src="scripts/app.js"></script>
    <!-- Favicon -->
    <link rel="icon" href="images/favicon-fresko.png">
</head>

<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <img src="images/logo-fresko.png" alt="Fresko Logo" class="logo-img">
            </div>
            <nav class="header-nav">
                <a href="index.html">Home</a>
                <a href="add-item.html">Add Item</a>
                <a href="recipes.html" class="active">Recipes</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>What's Cooking?</h1>
        <p>Using your "Critical" and "Warning" items.</p>

        <div class="controls controls-centered">
            <button id="find-recipes-btn" class="btn-primary btn-sky">
                Find Recipes
            </button>
        </div>

        <div id="recipe-grid" class="recipe-grid">
            <!-- Recipes injected here -->
        </div>
    </main>

    <footer>
        <p>José Roberto Hernández Peña | 2026 &copy; Fresko</p>
        <a href="https://youtu.be/n72Fk1OflOE" target="_blank">Watch Demo Video (YouTube)</a>
    </footer>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="location.href='index.html'">
            <span class="material-symbols-outlined nav-icon">home</span>
            Home
        </button>
        <div class="add-btn-wrapper">
            <button class="add-btn" onclick="location.href='add-item.html'">
                <span class="material-symbols-outlined">add</span>
            </button>
        </div>
        <button class="nav-item active" onclick="location.href='recipes.html'">
            <span class="material-symbols-outlined nav-icon">restaurant_menu</span>
            Recipes
        </button>
    </nav>

    <!-- Recipe Modal -->
    <div id="recipe-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title" class="modal-title-custom">Recipe Title</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <img id="modal-image" class="modal-image" src="" alt="Recipe">
                <div id="modal-ingredients">
                    <!-- Ingredients list -->
                </div>
                <a id="modal-link" href="#" target="_blank" class="btn-primary btn-block-link">View Full
                    Instructions</a>
            </div>
        </div>
    </div>

</body>

</html>
