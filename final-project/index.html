<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresko - Inventory</title>
    <meta name="description"
        content="Manage your household grocery inventory, track expiration dates, and reduce food waste with Fresko.">
    <meta name="author" content="José Roberto Hernández Peña">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="Fresko - Your Smart Pantry">
    <meta property="og:description" content="Track your groceries and fight food waste with style.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/og-image.png"> 

    <!-- Fonts: Archivo Black & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- CSS -->
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/inventory.css">
    <!-- JS -->
    <script type="module" src="scripts/app.js" defer></script>
    <!-- Favicon -->
    <link rel="icon" type="favicon" href="images/favicon-fresko.png">
</head>

<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <img src="images/logo-fresko.png" alt="Fresko Logo" class="logo-img">
            </div>
            <nav class="header-nav">
                <a href="index.html" class="active">Home</a>
                <a href="add-item.html">Add Item</a>
                <a href="recipes.html">Recipes</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>My Pantry</h1>

        <!-- Controls -->
        <div class="controls-container">
            <select id="sort-select">
                <option value="asc">Expiring Soonest</option>
                <option value="desc">Expiring Latest</option>
            </select>
            <button id="multi-action-btn">
                Delete Selected
            </button>
        </div>

        <div id="empty-state" class="empty-state">
            <h2>The pantry is empty!</h2>
            <p>Add more groceries to start tracking.</p>
        </div>

        <div id="inventory-list" class="inventory-list">
            <!-- Items injected here by JS -->
        </div>

    </main>

    <footer>
        <p>José Roberto Hernández Peña | 2026 &copy; Fresko</p>
        <a href="#" target="_blank">Watch Demo Video (YouTube)</a>
    </footer>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="location.href='index.html'">
            <span class="material-symbols-outlined nav-icon">home</span>
            Home
        </button>
        <div class="add-btn-wrapper">
            <button class="add-btn" onclick="location.href='add-item.html'">
                <span class="material-symbols-outlined">add</span>
            </button>
        </div>
        <button class="nav-item" onclick="location.href='recipes.html'">
            <span class="material-symbols-outlined nav-icon">restaurant_menu</span>
            Recipes
        </button>
    </nav>

    <!-- Action Modal -->
    <div id="action-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Action</h2>
            <p>What did you do with these items?</p>

            <div id="modal-quantity-group">
                <label for="action-quantity">Quantity
                    (Max: <span id="max-qty">1</span>)</label>
                <input type="number" id="action-quantity" min="1" value="1">
            </div>

            <div class="modal-actions">
                <button id="btn-consumed" class="btn-primary">Consumed</button>
                <button id="btn-waste" class="btn-primary">Thrown
                    Away</button>
                <button id="btn-cancel-action" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>



</body>

</html>
